<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galaxia de Flores</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#00060f;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{position:fixed;inset:0;pointer-events:none}
.script{font-family:'Great Vibes',cursive,serif}
#card{position:fixed;left:0;top:0;display:none;align-items:center;gap:12px;padding:12px 18px 12px 12px;max-width:min(90vw,400px);border-radius:60px;background:rgba(0,30,60,.6);border:1px solid rgba(140,210,255,.5);box-shadow:0 0 28px rgba(60,160,255,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none;animation:pop .35s ease}
@keyframes pop{from{opacity:0;scale:.7}to{opacity:1;scale:1}}
#av{flex:none;width:clamp(96px,27vw,128px);height:clamp(96px,27vw,128px);border-radius:50%;background:#0a3a78 center/cover;border:3px solid #bfe6ff;box-shadow:0 0 16px #5cb8ff;display:flex;align-items:center;justify-content:center;font-size:32px}
#cn{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8fd0ff}
#cp{font-size:clamp(20px,5vw,26px);line-height:1.15;color:#eaf7ff;text-shadow:0 0 10px #4db8ff}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;padding:8px;border-radius:999px;background:rgba(0,25,55,.55);border:1px solid rgba(140,210,255,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button{font:inherit;font-size:14px;color:#fff;padding:10px 14px;border-radius:999px;border:1px solid rgba(140,210,255,.35);background:rgba(120,190,255,.1);cursor:pointer}
button.main{background:linear-gradient(135deg,#2a8cff,#22c6e0);border-color:transparent}
#sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,380px);padding:18px;border-radius:20px;background:rgba(0,18,40,.94);border:1px solid rgba(140,210,255,.35);display:none;flex-direction:column;gap:8px}
#sheet label{font-size:12px;opacity:.75}
#sheet input,#sheet textarea{font:inherit;font-size:16px;color:#fff;background:rgba(120,190,255,.1);border:1px solid rgba(140,210,255,.3);border-radius:12px;padding:10px;resize:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

function setCam(){const m=innerWidth<768||innerWidth<innerHeight;cam.fov=m?88:75;cam.position.set(0,m?22:16,m?88:68);cam.updateProjectionMatrix();ctl.update()}setCam();
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
function pts(n,fn,mat){const p=new Float32Array(n*3),col=new Float32Array(n*3);for(let i=0;i<n;i++){const r=fn(i);p.set(r.p,i*3);col.set(r.c||[1,1,1],i*3)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));return new THREE.Points(g,mat)}
// background stars
scene.add(pts(3500,()=>{const u=Math.random()*6.28,v=Math.acos(2*Math.random()-1),r=380+Math.random()*120;return{p:[r*Math.sin(v)*Math.cos(u),r*Math.cos(v),r*Math.sin(v)*Math.sin(u)],c:[.8,.92,1]}},new THREE.PointsMaterial({size:1.5,sizeAttenuation:false,vertexColors:true,transparent:true,opacity:.85})));
// galaxy dust
const disc=pts(18000,()=>{const t=Math.pow(Math.random(),.6),d=4+t*96,a=(Math.floor(Math.random()*4))*1.5708+d*.07+gauss()*.55*(1.1-t),y=gauss()*2.4*(1-t*.7);return{p:[Math.cos(a)*d,y,Math.sin(a)*d],c:[.25+.75*(1-t),.6+.4*(1-t),1]}},new THREE.PointsMaterial({size:.5,vertexColors:true,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));scene.add(disc);
// sparkle squares
const spark=pts(450,()=>({p:[gauss()*110,gauss()*45+10,gauss()*110],c:[.8,.95,1]}),new THREE.PointsMaterial({size:1.1,vertexColors:true,transparent:true,opacity:.6,depthWrite:false}));scene.add(spark);
// glow core
(function(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),r=g.createRadialGradient(128,128,0,128,128,128);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.15,'rgba(150,225,255,.8)');r.addColorStop(.5,'rgba(40,130,255,.28)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,256,256);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false}));s.scale.set(60,60,1);scene.add(s);
const rg=new THREE.Mesh(new THREE.RingGeometry(5,6,96),new THREE.MeshBasicMaterial({color:0x9fe0ff,transparent:true,opacity:.8,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));rg.rotation.x=-Math.PI/2;scene.add(rg);scene.userData.ring=rg})();

// heart of particles
const heart=new THREE.Group();heart.position.set(0,48,0);scene.add(heart);
heart.add(pts(1500,i=>{const t=Math.random()*6.283,x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t),j=1+Math.random()*1.4;return{p:[x*.95+gauss()*j,y*.95+gauss()*j,gauss()*.8],c:[.6,.9,1]}},new THREE.PointsMaterial({size:.55,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false})));
let heartTxt;function buildHeart(){if(heartTxt){heart.remove(heartTxt);heartTxt.material.map.dispose()}heartTxt=new THREE.Sprite(new THREE.SpriteMaterial({map:txt([{t:'Te amo 💙',f:'italic 700 60px Georgia,serif'},{t:NAME,f:'700 38px Georgia,serif'}],512,192),transparent:true,depthWrite:false}));heartTxt.scale.set(18,6.75,1);heartTxt.position.y=1;heart.add(heartTxt)}buildHeart();

/* orbiting things */
const ORB=[],FLW=[],PHR=[];
function orbit(o,d,y,w){const it={o,d,a:Math.random()*6.283,y,w,ph:Math.random()*6.28,k:1,s:o.scale.x,sy:o.scale.y};ORB.push(it);return it}
for(let i=0;i<64;i++){const si=Math.floor(Math.random()*SP.length),o=new THREE.Sprite(new THREE.SpriteMaterial({map:TX[si],transparent:true,depthWrite:false}));const s=4+Math.random()*5;o.scale.set(s,s,1);o.userData={si};const it=orbit(o,14+Math.pow(Math.random(),.8)*80,gauss()*16+6,(.05+Math.random()*.06)/Math.sqrt(1+i%5));it.r0=Math.random()*6.28;it.sp=(Math.random()-.5)*.3;scene.add(o);FLW.push(it);o.userData.it=it}
function buildPhrases(){PHR.forEach(it=>{scene.remove(it.o);it.o.material.map.dispose();ORB.splice(ORB.indexOf(it),1)});PHR.length=0;
for(let i=0;i<24;i++){const o=new THREE.Sprite(new THREE.SpriteMaterial({map:txt([{t:PH[i%PH.length]+' 💙',f:'700 46px system-ui,sans-serif'}],512,96),transparent:true,depthWrite:false,opacity:.95}));const h=1.6+Math.random()*1.8;o.scale.set(h*5.33,h,1);scene.add(o);PHR.push(orbit(o,12+Math.random()*80,gauss()*9+3,(.04+Math.random()*.05)))}}buildPhrases();
// butterflies
const bt=document.createElement('canvas');bt.width=bt.height=128;(function(){const g=bt.getContext('2d');g.shadowColor='#6fd0ff';g.shadowBlur=8;[[-1],[1]].forEach(([m])=>{g.save();g.translate(64,64);g.scale(m,1);const gr=g.createLinearGradient(0,0,50,0);gr.addColorStop(0,'#0a3a9a');gr.addColorStop(1,'#7fd8ff');g.fillStyle=gr;g.beginPath();g.moveTo(2,0);g.bezierCurveTo(20,-60,60,-50,56,-8);g.bezierCurveTo(54,10,20,6,2,0);g.fill();g.beginPath();g.moveTo(2,4);g.bezierCurveTo(40,10,50,50,26,52);g.bezierCurveTo(8,50,4,24,2,4);g.fill();g.restore()});g.fillStyle='#02122e';g.fillRect(62,28,4,76)})();
const BF=[];const bTx=new THREE.CanvasTexture(bt);for(let i=0;i<5;i++){const o=new THREE.Sprite(new THREE.SpriteMaterial({map:bTx,transparent:true,depthWrite:false}));scene.add(o);BF.push({o,d:25+Math.random()*45,a:Math.random()*6.28,w:.08+Math.random()*.1,y:8+Math.random()*30,ph:Math.random()*6})}

/* UI */
const card=$('card'),av=$('av');
FOTOS.forEach(src=>{const im=new Image();im.src=src}); // precarga
function setFoto(i){
  if(!FOTOS.length)return;
  av.style.backgroundImage='url("'+FOTOS[i%FOTOS.length]+'")';
  av.style.backgroundSize='cover';av.style.backgroundPosition='center';av.textContent='';
}

const au=$('aud');if(MUSICA){au.src=MUSICA;const go=()=>au.play().catch(()=>{});go();addEventListener('pointerdown',go,{once:true})}


const fx=$('fx'),x2=fx.getContext('2d'),D=Math.min(2,devicePixelRatio||1),pet=[];
function rs(){fx.width=innerWidth*D;fx.height=innerHeight*D;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px'}rs();
function burst(x,y,n){const cs=['120,200,255','200,235,255','255,255,255','80,150,255'];for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1+Math.random()*3;pet.push({x:x*D,y:y*D,vx:Math.cos(a)*v*D,vy:(Math.sin(a)*v-1.5)*D,r:Math.random()*6,vr:(Math.random()-.5)*.2,s:(5+Math.random()*7)*D,l:1,c:cs[i%4]})}}
(function loop(){x2.clearRect(0,0,fx.width,fx.height);for(let i=pet.length-1;i>=0;i--){const p=pet[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.06*D;p.vx*=.99;p.r+=p.vr;p.l-=.009;if(p.l<=0){pet.splice(i,1);continue}x2.save();x2.translate(p.x,p.y);x2.rotate(p.r);x2.fillStyle='rgba('+p.c+','+p.l+')';x2.beginPath();x2.ellipse(0,0,p.s,p.s*.55,0,0,6.3);x2.fill();x2.restore()}requestAnimationFrame(loop)})();

let sel=null,tt;const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let dn=null;
function hide(){sel=null;card.style.display='none'}
cv.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>6)return;dn=null;
mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);
const h=ray.intersectObjects(FLW.map(f=>f.o))[0];burst(e.clientX,e.clientY,h?30:8);
if(!h){hide();return}
sel=h.object.userData.it;setFoto(FLW.indexOf(sel));$('cn').textContent='✿ '+SP[h.object.userData.si].n;$('cp').textContent=PH[Math.floor(Math.random()*PH.length)];card.style.display='flex';card.style.animation='none';void card.offsetWidth;card.style.animation='';clearTimeout(tt);tt=setTimeout(hide,7000)});

const clk=new THREE.Clock(),v3=new THREE.Vector3();
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rs()});
(function anim(){requestAnimationFrame(anim);const dt=Math.min(.05,clk.getDelta()),t=clk.elapsedTime;
disc.rotation.y+=dt*.03;spark.rotation.y-=dt*.01;scene.userData.ring.rotation.z+=dt*.2;heart.quaternion.copy(cam.quaternion);heart.position.y=48+Math.sin(t*.8)*1.5;
ORB.forEach(it=>{const o=it.o,sel_=it===sel;if(!sel_)it.a+=it.w*dt;o.position.set(Math.cos(it.a)*it.d,it.y+Math.sin(t*.8+it.ph)*1.2,Math.sin(it.a)*it.d);
if(o.userData.it){it.k+=((sel_?1.6:1)-it.k)*.1;const k=it.k*(1+.06*Math.sin(t*1.4+it.ph));o.scale.set(it.s*k,it.s*k,1);if(!sel_)o.material.rotation=it.r0+t*it.sp}});
BF.forEach(b=>{b.a+=b.w*dt;b.o.position.set(Math.cos(b.a)*b.d,b.y+Math.sin(t*1.3+b.ph)*4,Math.sin(b.a)*b.d);const f=.25+Math.abs(Math.cos(t*9+b.ph))*.75;b.o.scale.set(7*f,6,1)});
if(sel){const o=sel.o;v3.copy(o.position).project(cam);const x=(v3.x+1)/2*innerWidth,y=(1-v3.y)/2*innerHeight,px=o.scale.x*innerHeight/(2*Math.tan(cam.fov*.00872665)*cam.position.distanceTo(o.position)),half=Math.max(20,px/2),left=x>innerWidth*.55;
card.style.transform='translate('+(left?'calc(-100% + '+(x-half-8)+'px)':(x+half+8)+'px')+','+Math.min(innerHeight-130,Math.max(20,y-45))+'px)'}
ctl.update();R.render(scene,cam)})();
})();
</script>
</body>
